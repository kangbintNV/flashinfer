name: Bootstrap API gate demo PR
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  create-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const samples = [{"number": 6621, "audit_disposition": "true_issue"}, {"number": 6198, "audit_disposition": "true_issue"}, {"number": 5364, "audit_disposition": "true_issue"}, {"number": 5003, "audit_disposition": "true_issue"}, {"number": 4980, "audit_disposition": "true_issue"}, {"number": 4876, "audit_disposition": "true_issue"}, {"number": 4793, "audit_disposition": "true_issue"}, {"number": 4518, "audit_disposition": "true_issue"}, {"number": 4460, "audit_disposition": "true_issue"}, {"number": 2906, "audit_disposition": "true_issue"}, {"number": 7089, "audit_disposition": "expected"}, {"number": 6956, "audit_disposition": "expected"}, {"number": 6047, "audit_disposition": "expected"}, {"number": 5989, "audit_disposition": "expected"}, {"number": 5927, "audit_disposition": "expected"}, {"number": 5494, "audit_disposition": "expected"}, {"number": 5218, "audit_disposition": "expected"}, {"number": 5039, "audit_disposition": "expected"}, {"number": 5082, "audit_disposition": "expected"}, {"number": 4625, "audit_disposition": "expected"}, {"number": 5697, "audit_disposition": "false_positive"}, {"number": 5612, "audit_disposition": "false_positive"}, {"number": 5286, "audit_disposition": "false_positive"}, {"number": 5257, "audit_disposition": "false_positive"}, {"number": 5138, "audit_disposition": "false_positive"}, {"number": 5070, "audit_disposition": "false_positive"}, {"number": 4697, "audit_disposition": "false_positive"}, {"number": 4624, "audit_disposition": "false_positive"}, {"number": 4596, "audit_disposition": "false_positive"}, {"number": 4302, "audit_disposition": "false_positive"}];
            for (const sample of samples) {
              const number = sample.number;
              const base = `codex/api-audit-base-${number}`;
              const head = `codex/api-audit-head-${number}`;
              const { data: existing } = await github.rest.pulls.list({ ...context.repo, state: 'open', base, head: `${context.repo.owner}:${head}` });
              if (existing.length) { core.notice(existing[0].html_url); continue; }
              const { data: pr } = await github.rest.pulls.create({
                ...context.repo, base, head,
                title: `[API audit demo] Replay upstream #${number}`,
                body: `Fork-only replay of https://github.com/flashinfer-ai/flashinfer/pull/${number}.\n\nSelected from the 2026-10-28 API alert audit. Historical disposition: **${sample.audit_disposition}** (reference only; the current checker applies its own rules).\n\nThe original source-tree change is preserved; only workflows are replaced with an isolated demo harness. Checker revision: cbe3ee7dff49b55a53ab13dae87489b24cb8d28f. Source snapshot details are in the local experiment manifest.\n\nThis PR is created by GitHub Actions to permit independent maintainer expected-command testing. No merge is intended.`,
              });
              core.notice(`${number}: ${pr.html_url}`);
              await new Promise(resolve => setTimeout(resolve, 1200));
            }
