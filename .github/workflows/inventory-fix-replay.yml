name: Bot Run Demo - Inventory Fix
on:
  push:
    branches:
      - 'codex/bot-run-demo-inventory-fix-20261126/*/head'
      - 'codex/bot-run-demo-inventory-fix-20261126/preflight'
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            experiments
      - name: Replay original evidence with full-tree file validation
        env:
          GH_TOKEN: ${{ github.token }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_BASE_URL: ${{ vars.INFERENCE_BASE_URL }}
          CI_BOT_TARGET_MODEL: 'azure/anthropic/claude-opus-5'
          CI_BOT_TARGET_TIMEOUT_SECONDS: '360'
        run: python3 scripts/infra/pr_checks/demo_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-replay-result
          path: reports/result.json
