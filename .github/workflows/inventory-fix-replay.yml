name: Inference Hub JSON Diagnosis
on:
  push:
    branches:
      - 'codex/bot-json-diagnosis-20261126/**'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Capture eight frozen requests with the original parser
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_BASE_URL: ${{ vars.INFERENCE_BASE_URL }}
          CI_BOT_TARGET_MODEL: 'azure/anthropic/claude-opus-5'
        run: python3 scripts/run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-json-diagnosis-all
          path: reports/
