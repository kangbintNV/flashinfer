name: Diagnose Inference Hub JSON failures
on:
  push:
    branches: ['codex/bot-json-diagnosis-20261126/**']
permissions:
  contents: read
jobs:
  diagnose:
    name: PR ${{ matrix.case }} - unchanged 4000 tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [9964, 9974, 9771, 9894, 9846, 9834, 8464, 9916]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Replay frozen final request and capture response
        env:
          CASE_ID: ${{ matrix.case }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_BASE_URL: ${{ vars.INFERENCE_BASE_URL }}
          CI_BOT_TARGET_MODEL: azure/anthropic/claude-opus-5
        run: python3 scripts/diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-json-diagnosis-${{ matrix.case }}
          path: reports/
