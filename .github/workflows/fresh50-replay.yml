name: Bot Run Fresh 50 Historical Experiment
on:
  push:
    branches: ['codex/bot-run-fresh50-20261126/**']
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  replay:
    if: endsWith(github.ref, '/head') || endsWith(github.ref, '/preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            experiments
      - name: Run immutable checker with frozen original evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_BASE_URL: 'https://inference-api.nvidia.com/v1'
          CI_BOT_TARGET_MODEL: 'azure/anthropic/claude-opus-5'
          CI_BOT_TARGET_TIMEOUT_SECONDS: '360'
        run: python3 scripts/infra/pr_checks/fresh50_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh50-evidence-and-results
          path: reports/
