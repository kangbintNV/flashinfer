name: PR API Compatibility

on:
  pull_request_target:
    branches: ["codex/api-demo-base-*", "codex/api-audit-base-*"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  statuses: write

jobs:
  api:
    if: github.event.action != 'edited' || github.event.changes.base.ref != null
    name: Trusted API compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: api-compatibility-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - name: Mark current API gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          API_GATE_STATE: pending
          API_GATE_DESCRIPTION: Preparing trusted API scan
        run: &api-gate-status |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          root = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
          target = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          for name in ("API compatibility", f"api-scan/pr-{pr['number']}"):
              with urlopen(Request(root + "/pulls/" + str(pr["number"]), headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}), timeout=60) as response:
                  latest = json.load(response)
              if latest["state"] != "open" or any(latest[side]["sha"] != pr[side]["sha"] for side in ("head", "base")):
                  break
              data = {"context": name, "state": os.environ["API_GATE_STATE"], "description": os.environ["API_GATE_DESCRIPTION"], "target_url": target}
              request = Request(root + "/statuses/" + pr["head"]["sha"], data=json.dumps(data).encode(), method="POST", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              with urlopen(request, timeout=60) as response:
                  response.read()
          PYTHON
      # Never checkout or execute the PR head in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: 12d038069e9a433c8f4e1a4877d9598419e83b48
          fetch-depth: 0
          persist-credentials: false
      - name: Test trusted API policy and gate
        run: |
          python3 -m unittest discover -s scripts/infra/tests -p 'test*api*.py' -v
      - name: Scan git objects and publish API gate
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/infra/pr_checks/api_gate.py scan
      - name: Upload trusted API evidence
        id: evidence
        if: always()
        continue-on-error: true
        run: exit 1
      - name: Report evidence upload failure
        if: steps.evidence.outcome == 'failure'
        run: echo "::warning::API evidence upload failed; the completed gate result is unchanged."
      - name: Fail API gate if workflow execution failed
        if: failure() && steps.scan.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          API_GATE_STATE: error
          API_GATE_DESCRIPTION: Trusted API workflow did not complete
        run: *api-gate-status
      - name: Upload review experiment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-upload-failure-proof
          path: reports/public-api.json
